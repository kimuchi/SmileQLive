# =============================================================================
# SmileQ Live / Supabase CLI 設定（ローカル開発用の最小構成）
# =============================================================================
# 本番・ステージングは Supabase ダッシュボード側の設定が正。
# ここはあくまで `supabase start` で動かすローカル環境の定義。
# =============================================================================

project_id = "smileq-live"

# -----------------------------------------------------------------------------
# PostgREST
#   public スキーマだけを公開する。auth / storage / realtime を露出させない。
# -----------------------------------------------------------------------------
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# 参加者一覧・ランキングは関数側で件数を絞るため、素の SELECT は小さく抑える。
max_rows = 1000

# -----------------------------------------------------------------------------
# PostgreSQL
# -----------------------------------------------------------------------------
[db]
port = 54322
shadow_port = 54320
# trim_scale() を使うため 13 以上が必須。運用は 15 以上。
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

# -----------------------------------------------------------------------------
# Realtime
#   Broadcast (private channel) のみを使う。postgres_changes は使わない。
# -----------------------------------------------------------------------------
[realtime]
enabled = true

# -----------------------------------------------------------------------------
# Studio / メール確認
# -----------------------------------------------------------------------------
[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

# -----------------------------------------------------------------------------
# Storage
#   問題画像は WebP へ変換済みのものだけを非公開バケットへ置く。
# -----------------------------------------------------------------------------
[storage]
enabled = true
file_size_limit = "8MiB"

[storage.buckets.quiz-media]
public = false
file_size_limit = "8MiB"
allowed_mime_types = ["image/webp"]

# -----------------------------------------------------------------------------
# Auth
#   * 司会者は招待制。自己登録は無効。
#   * 参加者・投影担当は匿名サインインを使う（参加は QR の URL 直行のみ）。
# -----------------------------------------------------------------------------
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000", "http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# 司会者アカウントは管理者が作成する。誰でもサインアップできないようにする。
enable_signup = false
# 参加者・投影担当は匿名ユーザーとして認証する。
enable_anonymous_sign_ins = true
enable_manual_linking = false

[auth.email]
enable_signup = false
enable_confirmations = false
double_confirm_changes = true
secure_password_change = true

[auth.sms]
enable_signup = false
enable_confirmations = false

# 会場の Wi-Fi は NAT で同一 IP になりやすい。
# 匿名サインインの既定レート制限（30 件/時/IP）では 200 人規模の会場で詰まるため緩める。
# 本番プロジェクトでも Dashboard → Authentication → Rate Limits で同じ値にすること。
[auth.rate_limit]
anonymous_users = 500
token_refresh = 1800
sign_in_sign_ups = 300

# -----------------------------------------------------------------------------
# 未使用の機能
# -----------------------------------------------------------------------------
[analytics]
enabled = false

[edge_runtime]
enabled = false

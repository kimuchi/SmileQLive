name: Deploy to Cloud Run

# ローカルと同じ scripts/deploy-cloud-run.mjs を呼ぶ。
# CI とローカルでデプロイロジックを二重に持たない。

on:
  workflow_dispatch:
    inputs:
      environment:
        description: デプロイ先
        type: choice
        options: [staging, production]
        default: staging
        required: true
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Workload Identity 連携に必要

jobs:
  deploy:
    name: ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    env:
      TARGET_ENV: ${{ github.event.inputs.environment || 'staging' }}
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # サービスアカウント鍵 (JSON) は使わず Workload Identity 連携を使う。
      - name: Google Cloud 認証
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # 実値のデプロイ設定はリポジトリへコミットしないため、ここで組み立てる。
      # Firebase 版はサーバー用の秘密情報を持たない（Cloud Run の ADC で認証する）ため、
      # ここに現れる値はすべて「公開してよい設定」だけ。GitHub Secrets は使わない。
      - name: デプロイ設定を生成
        run: |
          node -e '
            const fs = require("node:fs");
            const env = process.env;
            const projectId = env.FIREBASE_PROJECT_ID || env.GCP_PROJECT_ID;
            const config = {
              projectId: env.GCP_PROJECT_ID,
              region: env.GCP_REGION || "asia-northeast1",
              serviceName: env.CLOUD_RUN_SERVICE,
              serviceAccount: env.GCP_RUNTIME_SERVICE_ACCOUNT,
              customDomain: env.CUSTOM_DOMAIN || "",
              domainMode: env.DOMAIN_MODE || "domain-mapping",
              appBaseUrl: env.APP_BASE_URL || "",
              firebaseProjectId: projectId,
              firebaseApiKey: env.FIREBASE_API_KEY,
              firebaseAuthDomain: env.FIREBASE_AUTH_DOMAIN || `${projectId}.firebaseapp.com`,
              firebaseStorageBucket: env.FIREBASE_STORAGE_BUCKET || `${projectId}.firebasestorage.app`,
              firebaseAppId: env.FIREBASE_APP_ID || "",
              allowedAuthDomains: (env.ALLOWED_AUTH_DOMAINS || "").split(",").map((s) => s.trim()).filter(Boolean),
              mediaBucket: env.MEDIA_BUCKET || `${projectId}.firebasestorage.app`,
              minInstances: Number(env.MIN_INSTANCES || 0),
              maxInstances: Number(env.MAX_INSTANCES || 10),
              concurrency: Number(env.CONCURRENCY || 80),
              logLevel: env.LOG_LEVEL || "info",
              turnstileSiteKey: env.TURNSTILE_SITE_KEY || "",
              turnstileSecretName: env.TURNSTILE_SECRET_NAME || "",
              requireCleanTree: false,
              runVerifyBeforeDeploy: true,
              allowedBranches: []
            };
            fs.writeFileSync(`deploy/cloud-run.${env.TARGET_ENV}.json`, JSON.stringify(config, null, 2));
          '
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          DOMAIN_MODE: ${{ vars.DOMAIN_MODE }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          ALLOWED_AUTH_DOMAINS: ${{ vars.ALLOWED_AUTH_DOMAINS }}
          MEDIA_BUCKET: ${{ vars.MEDIA_BUCKET }}
          MIN_INSTANCES: ${{ vars.MIN_INSTANCES }}
          MAX_INSTANCES: ${{ vars.MAX_INSTANCES }}
          CONCURRENCY: ${{ vars.CONCURRENCY }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_NAME: ${{ vars.TURNSTILE_SECRET_NAME }}

      # Rules は「クライアントが直接 Firestore を叩いても正解が漏れない」ための最終防壁。
      # アプリより先に反映する（新しいルールが要るデータ構造へ先に移らないため）。
      - name: Security Rules とインデックスを反映
        run: node scripts/deploy-rules.mjs "$TARGET_ENV" --yes

      - name: デプロイ
        run: node scripts/deploy-cloud-run.mjs "$TARGET_ENV" --yes

      - name: 設定ファイルを削除
        if: always()
        run: rm -f deploy/cloud-run.*.json

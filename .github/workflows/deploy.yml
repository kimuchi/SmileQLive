name: Deploy to Cloud Run

# ローカルと同じ scripts/deploy-cloud-run.mjs を呼ぶ。
# CI とローカルでデプロイロジックを二重に持たない。

on:
  workflow_dispatch:
    inputs:
      environment:
        description: デプロイ先
        type: choice
        options: [staging, production]
        default: staging
        required: true
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # Workload Identity 連携に必要

jobs:
  deploy:
    name: ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    env:
      TARGET_ENV: ${{ github.event.inputs.environment || 'staging' }}
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # サービスアカウント鍵 (JSON) は使わず Workload Identity 連携を使う。
      - name: Google Cloud 認証
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # 実値のデプロイ設定はリポジトリへコミットしないため、ここで組み立てる。
      # Secret の「値」は含めず、Secret Manager 上の名前だけを渡す。
      - name: デプロイ設定を生成
        run: |
          node -e '
            const fs = require("node:fs");
            const env = process.env;
            const config = {
              projectId: env.GCP_PROJECT_ID,
              region: env.GCP_REGION || "asia-northeast1",
              serviceName: env.CLOUD_RUN_SERVICE,
              serviceAccount: env.GCP_RUNTIME_SERVICE_ACCOUNT,
              customDomain: env.CUSTOM_DOMAIN || "",
              domainMode: env.DOMAIN_MODE || "domain-mapping",
              appBaseUrl: env.APP_BASE_URL || "",
              supabaseUrl: env.SUPABASE_URL,
              supabasePublishableKey: env.SUPABASE_PUBLISHABLE_KEY,
              supabaseSecretName: env.SUPABASE_SECRET_NAME,
              mediaBucket: env.QUIZ_MEDIA_BUCKET || "quiz-media",
              minInstances: Number(env.MIN_INSTANCES || 0),
              maxInstances: Number(env.MAX_INSTANCES || 10),
              concurrency: Number(env.CONCURRENCY || 80),
              logLevel: env.LOG_LEVEL || "info",
              requireCleanTree: false,
              runVerifyBeforeDeploy: true,
              allowedBranches: []
            };
            fs.writeFileSync(`deploy/cloud-run.${env.TARGET_ENV}.json`, JSON.stringify(config, null, 2));
          '
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          DOMAIN_MODE: ${{ vars.DOMAIN_MODE }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_NAME: ${{ vars.SUPABASE_SECRET_NAME }}
          QUIZ_MEDIA_BUCKET: ${{ vars.QUIZ_MEDIA_BUCKET }}
          MIN_INSTANCES: ${{ vars.MIN_INSTANCES }}
          MAX_INSTANCES: ${{ vars.MAX_INSTANCES }}
          CONCURRENCY: ${{ vars.CONCURRENCY }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}

      - name: デプロイ
        run: node scripts/deploy-cloud-run.mjs "$TARGET_ENV" --yes

      - name: 設定ファイルを削除
        if: always()
        run: rm -f deploy/cloud-run.*.json
